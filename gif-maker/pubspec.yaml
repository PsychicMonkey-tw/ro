name: gifcraft
description: GifCraft — create GIFs from video, photos, or camera on Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  in_app_purchase: ^3.2.0
  ffmpeg_kit_flutter_new: ^3.1.0
  gal: ^2.3.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
